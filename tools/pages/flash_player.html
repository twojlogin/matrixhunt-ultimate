<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <script>try{var _l=localStorage.getItem('mh_lang');if(_l!=='pl'&&_l!=='en'){_l=(navigator.language||'en').toLowerCase().indexOf('pl')===0?'pl':'en';}document.documentElement.setAttribute('data-lang',_l);}catch(e){document.documentElement.setAttribute('data-lang','en');}</script>
    <script>try{var _t=localStorage.getItem('mh_theme');document.documentElement.setAttribute('data-theme',_t==='matrix'||_t==='night'||_t==='day'?_t:'night')}catch(e){document.documentElement.setAttribute('data-theme','night')}</script>
    <title>MATRIX FLASH ARCADE</title>
    <script src="/tools/scripts/site.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--card);
    color:var(--green);
    font-family:'Courier New', monospace;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  #matrix-bg {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
    pointer-events:none;
  }
  .scanlines {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:9998;
    pointer-events:none;
  }
  .crt-flicker {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(10, 255, 10, 0.005);
    z-index:9997;
    pointer-events:none;
    animation:flicker 0.15s infinite;
  }
  @keyframes flicker {
    0% { opacity:0.27861; }
    5% { opacity:0.34769; }
    10% { opacity:0.23604; }
    15% { opacity:0.90626; }
    20% { opacity:0.18128; }
    25% { opacity:0.83891; }
    30% { opacity:0.65583; }
    35% { opacity:0.67807; }
    40% { opacity:0.26559; }
    45% { opacity:0.84693; }
    50% { opacity:0.96019; }
    55% { opacity:0.08594; }
    60% { opacity:0.20313; }
    65% { opacity:0.71988; }
    70% { opacity:0.53455; }
    75% { opacity:0.37288; }
    80% { opacity:0.71428; }
    85% { opacity:0.70419; }
    90% { opacity:0.7003; }
    95% { opacity:0.36108; }
    100% { opacity:0.24387; }
  }
  .content {
    position:relative;
    z-index:1;
    max-width:960px;
    margin:0 auto;
    padding:20px;
  }
  header {
    text-align:center;
    padding:20px 0;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
  }
  header h1 {
    font-size:1.4em;
    letter-spacing:3px;
    text-shadow:var(--glow);
  }
  .section {
    border:1px solid var(--border);
    padding:15px;
    margin-bottom:20px;
    background:rgba(0, 20, 0, 0.5);
  }
  .section-title {
    font-size:0.9em;
    letter-spacing:2px;
    margin-bottom:10px;
    border-bottom:1px dashed var(--border);
    padding-bottom:5px;
  }
  .controls {
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .btn {
    background:transparent;
    border:1px solid var(--border);
    color:var(--green);
    font-family:'Courier New', monospace;
    padding:8px 16px;
    cursor:pointer;
    font-size:0.85em;
    letter-spacing:1px;
    transition:all 0.2s;
  }
  .btn:hover {
    background:var(--text);
    color:var(--bg);
    box-shadow:var(--glow);
  }
  .btn:active { transform:scale(0.95); }
  .btn:disabled {
    opacity:0.3;
    cursor:not-allowed;
  }
  .btn:disabled:hover {
    background:transparent;
    color:var(--green);
    box-shadow:var(--glow);
  }
  .info-panel {
    font-size:0.8em;
    line-height:1.6;
  }
  .info-panel .label {
    color:var(--muted);
  }
  .info-panel .value {
    color:var(--green);
  }
  .info-panel .notice {
    border-top:1px dashed var(--border);
    margin-top:10px;
    padding-top:10px;
    color:var(--muted);
    font-size:0.9em;
  }
  .quick-links a {
    color:var(--green);
    text-decoration:none;
    border:1px solid var(--border);
    padding:6px 12px;
    display:inline-block;
    margin:4px;
    font-size:0.8em;
    transition:all 0.2s;
  }
  .quick-links a:hover {
    background:var(--text);
    color:var(--bg);
    box-shadow:var(--glow);
  }
  footer {
    border-top:1px solid var(--border);
    padding:15px 0;
    text-align:center;
    margin-top:20px;
  }
  footer nav a {
    color:var(--green);
    text-decoration:none;
    margin:0 10px;
    font-size:0.85em;
    letter-spacing:1px;
    transition:color 0.2s;
  }
  footer nav a:hover {
    text-shadow:var(--glow);
  }
  .blink {
    animation:blink 1s step-end infinite;
  }
  @keyframes blink {
    50% { opacity:0; }
  }
  @media (max-width:600px) {
    header h1 { font-size:1em; }
    .content { padding:10px; }
  }
</style>
    <link rel="stylesheet" href="/tools/assets/theme.css">
</head>
<body>
<canvas id="matrix-bg"></canvas>
<div class="scanlines"></div>
<div class="crt-flicker"></div>

<div class="content">
  <header>
    <h1>[ MATRIX FLASH ARCADE ]</h1>
  </header>

  <div class="section">
    <div class="section-title">&gt; PLAY NOW_</div>
    <p class="hint" style="margin-bottom:10px;">Choose a game and press PLAY. When the game screen appears, click "Click to Begin" inside it. The game loads online; no game file or launcher download needed.</p>
    <div class="controls">
      <select id="arcade-game" class="btn" aria-label="Choose arcade game">
        <option value="arcade_1942">1942</option>
        <option value="arcade_invaders">Space Invaders</option>
        <option value="arcade_20pacgal">Ms. Pac-Man / Galaga</option>
        <option value="custom">Własny ID archive.org...</option>
      </select>
      <input id="arcade-custom" class="btn" type="text" placeholder="np. arcade_pacman" style="min-width:220px;" />
      <button class="btn" id="arcade-load" type="button">[ PLAY SELECTED GAME ]</button>
      <button class="btn" id="arcade-fullscreen" type="button">[ FULLSCREEN ]</button>
    </div>
    <iframe id="arcade-frame" title="Browser arcade game" src="https://archive.org/embed/arcade_1942"
      allow="autoplay; gamepad" allowfullscreen loading="eager" referrerpolicy="no-referrer"
      style="display:block;width:100%;height:min(70vh,700px);min-height:420px;margin-top:12px;border:1px solid var(--border);background:#000;"></iframe>
  </div>

  <footer>
    <nav>
      <a href="/">HOME</a> |
      <a href="/offers">OFERTY</a> |
      <a href="/view">VIEW</a> |
      <a href="/db">DB</a> |
      <a href="/retro">RETRO</a> |
      <a href="/pad">PAD</a> |
      <a href="/wiki">WIKI</a> |
      <a href="/bookmarks">BOOKMARKS</a> |
      <a href="/flash">FLASH</a> |
      <a href="/uwagi">UWAGI</a>
    </nav>
  </footer>
</div>

<script>
(function() {
  window.MH.matrixRain();

  const arcadeGames = {
    arcade_1942: '1942',
    arcade_invaders: 'Space Invaders',
    arcade_20pacgal: 'Ms. Pac-Man / Galaga'
  };
  const arcadeSelect = document.getElementById('arcade-game');
  const arcadeCustom = document.getElementById('arcade-custom');
  const arcadeFrame = document.getElementById('arcade-frame');
  function resolveId() {
    if (arcadeSelect.value === 'custom') return (arcadeCustom.value || '').trim();
    return arcadeSelect.value;
  }
  function loadArcadeGame() {
    const id = resolveId();
    if (!id) return;
    const title = arcadeGames[id] || id;
    const url = 'https://archive.org/embed/' + encodeURIComponent(id);
    arcadeFrame.src = url;
    arcadeFrame.title = title;
  }
  document.getElementById('arcade-load').addEventListener('click', loadArcadeGame);
  arcadeSelect.addEventListener('change', loadArcadeGame);
  document.getElementById('arcade-fullscreen').addEventListener('click', function() {
    const el = arcadeFrame;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  });
})();
</script>

    <script src="/tools/assets/theme.js"></script>
    <script src="/tools/assets/api.js"></script>
    <script src="/tools/assets/lang.js"></script>
    <script src="/tools/assets/outbound.js"></script>

</body>
</html>
