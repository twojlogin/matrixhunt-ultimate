<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <script>try{var _l=localStorage.getItem('mh_lang');if(_l!=='pl'&&_l!=='en'){_l=(navigator.language||'en').toLowerCase().indexOf('pl')===0?'pl':'en';}document.documentElement.setAttribute('data-lang',_l);}catch(e){document.documentElement.setAttribute('data-lang','en');}</script>
<title>MATRIXHUNT // DB SCANNER</title>
    <script>try{var _t=localStorage.getItem('mh_theme');document.documentElement.setAttribute('data-theme',_t==='matrix'||_t==='night'||_t==='day'?_t:'night')}catch(e){document.documentElement.setAttribute('data-theme','night')}</script>
    <style>
        :root {
            --green: #0f0; --muted: #0a0; --cyan: #0ff; --text: #0f0;
            --bg: #000; --card: rgba(0,20,0,0.85); --border: #0f0;
            --dim: rgba(0,255,0,0.15);
            --glow: 0 0 10px #0f0, 0 0 20px rgba(0,255,0,0.3);
            --font: 'Courier New', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 20px 15px 80px; }
        .wrap { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; padding: 10px 0 20px; }
        header h1 { font-size: 1.6em; letter-spacing: 5px; text-shadow: var(--glow); }
        header p { font-size: 0.75em; opacity: 0.7; margin-top: 6px; }
        nav { text-align: center; margin-bottom: 18px; font-size: 0.8em; }
        nav a { color: var(--green); text-decoration: none; margin: 0 10px; }
        #controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
        #controls select, #controls input {
            font-family: inherit; font-size: 0.85em; background: var(--card);
            color: var(--text); border: 1px solid var(--border); padding: 8px 10px;
        }
        #controls input { flex: 1; min-width: 200px; }
        #controls button {
            font-family: inherit; font-size: 0.85em; background: var(--card);
            color: var(--text); border: 1px solid var(--border); padding: 8px 14px; cursor: pointer;
        }
        #controls button:hover { background: var(--dim); }
        #meta { font-size: 0.75em; opacity: 0.7; margin-bottom: 10px; }
        #gridwrap { overflow-x: auto; border: 1px solid var(--border); }
        table { border-collapse: collapse; width: 100%; font-size: 0.75em; }
        th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
        th { background: var(--dim); position: sticky; top: 0; white-space: nowrap; }
        td { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
        tr:nth-child(even) td { background: var(--dim); }
        #pager { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-size: 0.8em; }
        #pager button {
            font-family: inherit; font-size: 1em; background: var(--card);
            color: var(--text); border: 1px solid var(--border); padding: 6px 14px; cursor: pointer;
        }
        #pager button:disabled { opacity: 0.3; cursor: default; }
    </style>
    <link rel="stylesheet" href="/tools/theme.css">
</head>
<body>
    <div class="wrap">
        <header>
            <h1>▓▓▓ MATRIX DB-SCANNER ▓▓▓</h1>
            <p data-i18n="db.sub">Read-only view of the app database. No SQLite tools needed. Writes are impossible.</p>
        </header>
        <nav>
            <a href="/">HOME</a>
            <a href="/offers">OFERTY</a>
            <a href="/view">VIEW</a>
            <a href="/db">DB</a>
            <a href="/retro">RETRO</a>
            <a href="/pad">PAD</a>
            <a href="/wiki">WIKI</a>
            <a href="/bookmarks">BOOKMARKS</a>
            <a href="/flash">FLASH</a>
            <a href="/uwagi">UWAGI</a>
        </nav>
        <div id="controls">
            <select id="tbl"></select>
            <input id="q" type="text" data-i18n-ph="db.search_ph" placeholder="SEARCH ALL COLUMNS... (Enter)">
            <button id="go" type="button" data-i18n="db.search">SEARCH</button>
        </div>
        <div id="meta">…</div>
        <div id="gridwrap"><table id="grid"><thead></thead><tbody></tbody></table></div>
        <div id="pager">
            <button id="prev" type="button" data-i18n="db.prev">← PREV</button>
            <span id="pginfo"></span>
            <button id="next" type="button" data-i18n="db.next">NEXT →</button>
        </div>
    </div>
    <script>
        (function () {
            var tbl = document.getElementById('tbl');
            var q = document.getElementById('q');
            var meta = document.getElementById('meta');
            var thead = document.querySelector('#grid thead');
            var tbody = document.querySelector('#grid tbody');
            var pginfo = document.getElementById('pginfo');
            var prev = document.getElementById('prev');
            var next = document.getElementById('next');
            var page = 1, total = 0;
            var LIMIT = 100;

            function esc(s) {
                return String(s == null ? '' : s).replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function loadTables() {
                fetch('/api/db/tables').then(function (r) { return r.json(); }).then(function (list) {
                    tbl.innerHTML = '';
                    list.forEach(function (t) {
                        var o = document.createElement('option');
                        o.value = t.table;
                        o.textContent = t.table + ' (' + t.rows + ')';
                        tbl.appendChild(o);
                    });
                    var offers = list.find(function (t) { return t.table === 'offers'; });
                    if (offers) tbl.value = 'offers';
                    loadRows();
                }).catch(function () { meta.textContent = 'DB UNREACHABLE'; });
            }

            function loadRows() {
                var url = '/api/db/rows?table=' + encodeURIComponent(tbl.value) +
                    '&search=' + encodeURIComponent(q.value.trim()) + '&page=' + page + '&limit=' + LIMIT;
                fetch(url).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                }).then(function (d) {
                    total = d.total;
                    thead.innerHTML = '<tr>' + d.columns.map(function (c) {
                        return '<th>' + esc(c) + '</th>';
                    }).join('') + '</tr>';
                    tbody.innerHTML = d.rows.map(function (row) {
                        return '<tr>' + row.map(function (cell) {
                            var s = cell == null ? '' : String(cell);
                            return '<td title="' + esc(s.slice(0, 500)) + '">' + esc(s.slice(0, 120)) + '</td>';
                        }).join('') + '</tr>';
                    }).join('');
                    var pages = Math.max(1, Math.ceil(total / LIMIT));
                    meta.textContent = d.table + ': ' + total + ' rows' +
                        (q.value.trim() ? ' (filter: "' + q.value.trim() + '")' : '');
                    pginfo.textContent = 'page ' + page + ' / ' + pages;
                    prev.disabled = page <= 1;
                    next.disabled = page >= pages;
                }).catch(function (e) { meta.textContent = 'ERROR: ' + e.message; });
            }

            document.getElementById('go').addEventListener('click', function () { page = 1; loadRows(); });
            q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { page = 1; loadRows(); } });
            tbl.addEventListener('change', function () { page = 1; loadRows(); });
            prev.addEventListener('click', function () { if (page > 1) { page--; loadRows(); } });
            next.addEventListener('click', function () { if (page * LIMIT < total) { page++; loadRows(); } });
            loadTables();
        })();
    </script>
    <script src="/tools/theme.js"></script>
    <script src="/tools/api.js"></script>
    <script src="/tools/lang.js"></script>

</body>
</html>
